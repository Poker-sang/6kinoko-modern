# Optional split example. Copy beside executable as input-actions.cfg.
# Unspecified actions continue to inherit keyconfig.dat, including controllers.
# Explicit actions replace their legacy binding; add pad:N for controller buttons.
version = 1
jump = key:Z
confirm = key:Return
attack = key:X
run = key:Left Shift
carry = key:V
door = key:E
pipeUp = key:W
pipeDown = key:S
pause = key:A
menuAcceptAlt = key:Escape
