name: Modern platform builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev
      - name: Apple shader tools
        if: runner.os == 'macOS'
        run: brew install glslang spirv-cross
      - name: Record source
        shell: bash
        run: mkdir -p build-runs/portable && git rev-parse HEAD > build-runs/portable/source-commit.txt
      - name: Configure portable modules
        run: cmake -S . -B build-runs/portable -DKINOKO_PLATFORM_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DKINOKO_RUNTIME_DIR=${{ github.workspace }}/runtime-builds/portable
      - name: Compile platform and codec contracts (no execution)
        run: cmake --build build-runs/portable --config Release --parallel 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-${{ matrix.os }}
          path: |
            build-runs/portable/source-commit.txt
            build-runs/portable/gpu-shader-toolchain.txt
            build-runs/portable/CMakeCache.txt
            build-runs/portable/CMakeFiles/CMakeConfigureLog.yaml
            runtime-builds/portable/
  game:
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Windows game with SDL bridge
        run: cmake -S . -B build-runs/bridge -A ${{ matrix.arch }} -DKINOKO_RETDEC_DISABLE_TRACE=ON -DKINOKO_RUNTIME_DIR=${{ github.workspace }}/runtime-builds/bridge
      - name: Build game and contracts
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'Win32') {
            cmake --build build-runs/bridge --config Release --parallel 4
          } else {
            cmake --build build-runs/bridge --config Release --target kinoko_modern_gpu kinoko_gpu_transfer_contract kinoko_savedata_file_contract kinoko_bytecode_wire_contract kinoko_file_archive_contract kinoko_script_random_contract kinoko_runtime_services_contract kinoko_directory_search_contract kinoko_input_actions_contract kinoko_input_script_contract kinoko_replay_contract kinoko_replay_runtime_contract kinoko_mod_resources_contract --parallel 4
          }
      - name: Validate Mod package and session tools (no gameplay)
        run: |
          python tests/mod_session_contract.py build-runs/bridge/mod-session-fixtures
          python tests/mod_manager_contract.py build-runs/bridge/mod-manager-fixtures
      - name: Run focused compatibility contracts (no gameplay)
        run: ctest --test-dir build-runs/bridge -C Release --output-on-failure -R "^(savedata_file|bytecode_wire|file_archive|script_random|runtime_services|directory_search|input_actions|input_script|replay|replay_runtime|replay_session|mod_resources)_contract$"
      - name: Package Windows game (without original DAT)
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'x64') { 'windows-x64' } else { 'windows-x86' }
          python tools/package_native.py --runtime runtime-builds/bridge --platform $platform --output runtime-builds/packages --tests-passed
      - name: Audit default dependency graph (no execution)
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content build-runs/bridge/source-commit.txt -Encoding ascii
          python tools/audit_d3d9_free.py --build build-runs/bridge --executable runtime-builds/bridge/kinoko_modern_gpu.exe --output build-runs/bridge/d3d9-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-game-${{ matrix.arch }}
          path: |
            runtime-builds/bridge/
            build-runs/bridge/gpu-shader-toolchain.txt
            build-runs/bridge/d3d9-audit.json
            build-runs/bridge/Testing/
            runtime-builds/packages/

  native-game:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libudev-dev
      - name: Apple shader tools
        if: runner.os == 'macOS'
        run: brew install glslang spirv-cross
      - name: Configure full game
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then extra+=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"); fi
          cmake -S . -B build-runs/native -DCMAKE_BUILD_TYPE=Release -DKINOKO_RETDEC_DISABLE_TRACE=ON -DKINOKO_RUNTIME_DIR=${{ github.workspace }}/runtime-builds/native "${extra[@]}"
      - name: Compile full game (no execution)
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > build-runs/native/source-commit.txt
          cmake --build build-runs/native --target kinoko_modern_gpu kinoko_gpu_transfer_contract kinoko_savedata_file_contract kinoko_bytecode_wire_contract kinoko_file_archive_contract kinoko_script_random_contract kinoko_runtime_services_contract kinoko_directory_search_contract kinoko_input_actions_contract kinoko_input_script_contract kinoko_replay_contract kinoko_replay_runtime_contract kinoko_mod_resources_contract --parallel 4 -- -k 2>&1 | tee build-runs/native/build.log
      - name: Package native game (without original DAT)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            lipo -info runtime-builds/native/kinoko_modern_gpu
            otool -L runtime-builds/native/kinoko_modern_gpu > build-runs/native/dependencies.txt
            python3 tools/package_native.py --runtime runtime-builds/native --platform macos-universal --output runtime-builds/packages
          else
            ldd runtime-builds/native/kinoko_modern_gpu > build-runs/native/dependencies.txt
            python3 tools/package_native.py --runtime runtime-builds/native --platform linux-x64 --output runtime-builds/packages
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: game-${{ matrix.os }}
          path: |
            build-runs/native/source-commit.txt
            build-runs/native/build.log
            build-runs/native/dependencies.txt
            build-runs/native/Testing/
            runtime-builds/packages/
            runtime-builds/native/
